# Runtime override for deploying YAAM API Wall on skz-data-lv.
#
# Keep secrets in the untracked .env file. This override only pins non-secret
# shared-service endpoints to the local data node so the runtime does not fall
# back to stale skz-dev-lv addresses.

services:
  mas-agent:
    environment:
      DATA_NODE_IP: "192.168.107.187"

      REDIS_HOST: "192.168.107.187"
      REDIS_PORT: "6379"
      REDIS_URL: "redis://192.168.107.187:6379/0"

      QDRANT_HOST: "192.168.107.187"
      QDRANT_PORT: "6333"
      QDRANT_GRPC_PORT: "6334"
      QDRANT_URL: "http://192.168.107.187:6333"
      QDRANT_GRPC_URL: "http://192.168.107.187:6334"

      NEO4J_HOST: "192.168.107.187"
      NEO4J_BOLT_PORT: "7687"
      NEO4J_HTTP_PORT: "7474"
      NEO4J_URI: "bolt://192.168.107.187:7687"
      NEO4J_BOLT: "bolt://192.168.107.187:7687"
      NEO4J_HTTP: "http://192.168.107.187:7474"

      TYPESENSE_HOST: "192.168.107.187"
      TYPESENSE_PORT: "8108"
      TYPESENSE_PROTOCOL: "http"
      TYPESENSE_URL: "http://192.168.107.187:8108"

      PHOENIX_URL: "http://192.168.107.187:6006"
      PHOENIX_COLLECTOR_ENDPOINT: "http://192.168.107.187:6006/v1/traces"
      PHOENIX_GRPC_URL: "http://192.168.107.187:4317"

  yaam-mcp:
    environment:
      DATA_NODE_IP: "192.168.107.187"

      REDIS_HOST: "192.168.107.187"
      REDIS_PORT: "6379"
      REDIS_URL: "redis://192.168.107.187:6379/0"

      QDRANT_HOST: "192.168.107.187"
