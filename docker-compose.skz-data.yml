      QDRANT_URL: "http://192.168.107.187:6333"
      QDRANT_GRPC_URL: "http://192.168.107.187:6334"

      NEO4J_HOST: "192.168.107.187"
      NEO4J_BOLT_PORT: "7687"
      NEO4J_HTTP_PORT: "7474"
      NEO4J_URI: "bolt://192.168.107.187:7687"
      NEO4J_BOLT: "bolt://192.168.107.187:7687"
      NEO4J_HTTP: "http://192.168.107.187:7474"

      TYPESENSE_HOST: "192.168.107.187"
      TYPESENSE_PORT: "8108"
      TYPESENSE_PROTOCOL: "http"
      TYPESENSE_URL: "http://192.168.107.187:8108"

      PHOENIX_URL: "http://192.168.107.187:6006"
      PHOENIX_COLLECTOR_ENDPOINT: "http://192.168.107.187:6006/v1/traces"
      PHOENIX_GRPC_URL: "http://192.168.107.187:4317"
