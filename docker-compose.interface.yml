version: "3.9"

services:
  mas-agent:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "8002:8080"
    environment:
      MAS_AGENT_TYPE: ${MAS_AGENT_TYPE:-full}
      MAS_MODEL: ${MAS_MODEL:-gemini-2.5-flash-lite}
      MAS_PORT: "8080"
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-tencent/hy3-preview}
      OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL:-qwen/qwen3-embedding-8b}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-4096}
      MAS_L3_COLLECTION: ${MAS_L3_COLLECTION:-episodes_qwen_v2}
      MAS_L4_COLLECTION: ${MAS_L4_COLLECTION:-knowledge_base_v2}
      POSTGRES_URL: ${POSTGRES_URL:-postgresql://mas:mas@localhost:5432/mas}
      REDIS_URL: ${REDIS_URL:-redis://localhost:6379/0}
      QDRANT_URL: ${QDRANT_URL:-http://localhost:6333}
      NEO4J_URI: ${NEO4J_URI:-bolt://localhost:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-mas-password}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      TYPESENSE_URL: ${TYPESENSE_URL:-http://localhost:8108}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-mas-typesense-key}
    volumes:
      - ./logs:/app/logs
    networks:
      - mas_network

  yaam-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - poetry
      - run
      - python
      - -m
      - src.mcp.server
      - --transport
      - streamable-http
      - --agent-type
      - full
      - --agent-variant
      - mcp
      - --mcp-host
      - 0.0.0.0
      - --mcp-port
      - "8081"
      - --mcp-path
      - /mcp
    ports:
      - "8003:8081"
    environment:
      MAS_AGENT_TYPE: ${MAS_AGENT_TYPE:-full}
      MAS_MODEL: ${MAS_MODEL:-gemini-2.5-flash-lite}
      MAS_PORT: "8080"
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-tencent/hy3-preview}
      OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL:-qwen/qwen3-embedding-8b}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-4096}
      MAS_L3_COLLECTION: ${MAS_L3_COLLECTION:-episodes_qwen_v2}
      MAS_L4_COLLECTION: ${MAS_L4_COLLECTION:-knowledge_base_v2}
      POSTGRES_URL: ${POSTGRES_URL:-postgresql://mas:mas@localhost:5432/mas}
      REDIS_URL: ${REDIS_URL:-redis://localhost:6379/0}
      QDRANT_URL: ${QDRANT_URL:-http://localhost:6333}
      NEO4J_URI: ${NEO4J_URI:-bolt://localhost:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-mas-password}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      TYPESENSE_URL: ${TYPESENSE_URL:-http://localhost:8108}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-mas-typesense-key}
      YAAM_MCP_ENABLE_WRITES: "false"
      YAAM_MCP_ENABLE_LIFECYCLE: "false"
      YAAM_MCP_ALLOWLISTED_TOOLS: ""
    volumes:
      - ./logs:/app/logs
    networks:
      - mas_network

networks:
  mas_network:
