# Non-secret runtime defaults for YAAM API Wall and MCP services.
#
# Secrets stay in .env or the deployment secret store. Environment variables
# override these values at runtime.

project:
  id: test

llm:
  openrouter_model: tencent/hy3-preview
  openrouter_embedding_model: qwen/qwen3-embedding-8b
  max_output_tokens: 8192
  openrouter_timeout_seconds: 120.0
  openrouter_reasoning_effort: low
  openrouter_reasoning_exclude: true

memory:
  l3:
    collection_name: yaam-test-episodes
    vector_size: 4096
  l4:
    collection_name: yaam-test
