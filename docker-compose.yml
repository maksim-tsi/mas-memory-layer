services:
  mas-agent:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8002:8080"
    environment:
      MAS_AGENT_TYPE: ${MAS_AGENT_TYPE:-full}
      MAS_MODEL: ${MAS_MODEL:-gemini-2.5-flash-lite}
      MAS_PORT: "8080"
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-tencent/hy3-preview}
      OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL:-qwen/qwen3-embedding-8b}
      MAS_MAX_OUTPUT_TOKENS: ${MAS_MAX_OUTPUT_TOKENS:-8192}
      MAS_OPENROUTER_TIMEOUT: ${MAS_OPENROUTER_TIMEOUT:-120.0}
      OPENROUTER_REASONING_EFFORT: ${OPENROUTER_REASONING_EFFORT:-low}
      OPENROUTER_REASONING_EXCLUDE: ${OPENROUTER_REASONING_EXCLUDE:-true}
      YAAM_PROJECT_ID: ${YAAM_PROJECT_ID:-test}
      YAAM_MCP_DOMAIN_PACKS: ${YAAM_MCP_DOMAIN_PACKS:-auto}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-4096}
      MAS_L3_COLLECTION: ${MAS_L3_COLLECTION:-}
      MAS_L4_COLLECTION: ${MAS_L4_COLLECTION:-}
      POSTGRES_URL: ${POSTGRES_URL:-postgresql://mas:mas@localhost:5432/mas}
      REDIS_URL: ${REDIS_URL:-redis://localhost:6379/0}
      QDRANT_URL: ${QDRANT_URL:-http://localhost:6333}
      NEO4J_URI: ${NEO4J_URI:-bolt://localhost:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-mas-password}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      TYPESENSE_URL: ${TYPESENSE_URL:-http://localhost:8108}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL:-qwen/qwen3-embedding-8b}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-mas-typesense-key}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-4096}
    volumes:
      - ./logs:/app/logs
    networks:
      - mas_network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  postgres:
    image: postgres:15
    profiles: ["local-db"]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: mas
      POSTGRES_PASSWORD: mas
      POSTGRES_DB: mas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mas_network

  redis:
    image: redis/redis-stack-server:latest
    profiles: ["local-db"]
    ports:
      - "6379:6379"
    networks:
      - mas_network

  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["local-db"]
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - mas_network

  typesense:
    image: typesense/typesense:0.25.2
    profiles: ["local-db"]
    ports:
      - "8108:8108"
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-mas-typesense-key}
      TYPESENSE_DATA_DIR: /data
    command:
      - "--data-dir"
      - "/data"
      - "--api-key"
      - "${TYPESENSE_API_KEY:-mas-typesense-key}"
      - "--enable-cors"
    volumes:
      - typesense_data:/data
    networks:
      - mas_network

  neo4j:
    image: neo4j:5.15
    profiles: ["local-db"]
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/mas-password
    volumes:
      - neo4j_data:/data
    networks:
      - mas_network

networks:
  mas_network:

volumes:
  postgres_data:
  qdrant_data:
  typesense_data:
  neo4j_data:
